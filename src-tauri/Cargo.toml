[package]
name = "philophais"
version = "1.0.0"
description = "Philophais Local Reader"
authors = ["Monty"]
license = "MIT"
repository = "https://github.com/Mors1A4/philophais"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "philophais_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
